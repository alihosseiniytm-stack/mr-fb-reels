name: YouTube v2 (weekday lessons + whale-story Shorts)

# T50-08 / T50-01. Cron lines are COMMENTED OUT on purpose (owner reviews the samples first). To turn on: uncomment the cron lines AND set
# instagram-bot/v2/schedule.json "enabled": true. Every upload first passes instagram-bot/v2/similarity-gate.mjs; too similar = not uploaded.
on:
  # schedule:
  #   - cron: "0 14 * * *"    # one long video per day (type chosen by weekday in schedule.json)
  #   - cron: "30 9,18 * * *" # Shorts (shortsPerDay)
  workflow_dispatch:
    inputs:
      style:
        description: "v6 (one style, own drawings; owner D178) or v5 (old doc style)"
        default: "v6"
      topic:
        description: "v6 lesson topic (hammer)"
        default: "hammer"
      kind:
        description: "short, long (v6 also: both)"
        default: "long"
      day:
        description: "sun mon tue wed thu fri sat (blank = today)"
        default: ""
      privacy:
        description: "private / unlisted / public (public only after owner approval)"
        default: "private"
      upload:
        description: "Upload after the gate passes"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: yt-v2
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install
        working-directory: instagram-bot
        run: |
          npm install
          sudo apt-get update -y
          sudo apt-get install -y fonts-noto-core ffmpeg espeak-ng
          npx playwright install --with-deps chromium
      - name: v6 shot-list gate test (a bad shot list must FAIL)
        if: ${{ inputs.style != 'v5' }}
        working-directory: instagram-bot
        run: node --test v2/test/*.test.mjs
      - name: Render v6 (own drawings, one picture per sentence)
        if: ${{ inputs.style != 'v5' }}
        working-directory: instagram-bot
        run: |
          K="${{ inputs.kind }}"; [ -z "$K" ] && K=short; [ "$K" = "both" ] && K="short long"
          for k in $K; do node v2/v6-make.mjs --kind=$k --topic=${{ inputs.topic || 'hammer' }} --out=out; done
      - name: v6 shot-list gate (every sentence = matching tagged picture, no shot > 6 s, no repeats; FAIL = not uploaded)
        if: ${{ inputs.style != 'v5' }}
        working-directory: instagram-bot
        run: |
          for m in out/*.meta.json; do node v2/shotlist-gate.mjs $m; done
      - name: Render v5
        if: ${{ inputs.style == 'v5' }}
        working-directory: instagram-bot
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: node v2/make.mjs --kind=${{ inputs.kind }} --out=out ${{ inputs.day != '' && format('--day={0}', inputs.day) || '' }}
      - name: Similarity gate
        working-directory: instagram-bot
        run: |
          for m in out/*.meta.json; do node v2/similarity-gate.mjs --check=$m; done
      - name: YouTube standards gate (YOUTUBE_STANDARDS.md; FAIL = not uploaded)
        working-directory: instagram-bot
        run: |
          for m in out/*.meta.json; do n=$(basename $m .meta.json); node v2/standards-check.mjs out $n; done
      - name: Upload to YouTube
        if: ${{ inputs.upload }}
        working-directory: instagram-bot
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          for m in out/*.meta.json; do b=${m%.meta.json}; node v2/upload.mjs --meta=$m --video=$b.mp4 --thumbA=$b-thumbA.png --thumbB=$b-thumbB.png --privacy=${{ inputs.privacy }}; done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: yt-v2-${{ github.run_id }}
          path: |
            instagram-bot/out/*.mp4
            instagram-bot/out/*.png
            instagram-bot/out/*.meta.json
            instagram-bot/out/*.md
            instagram-bot/out/*.txt
            instagram-bot/out/*-credits.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Save upload log + gate log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add instagram-bot/v2/uploads-log.json instagram-bot/v2/gate-log.jsonl || true
          git diff --cached --quiet || git commit -m "yt-v2: update upload/gate log [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push || true
