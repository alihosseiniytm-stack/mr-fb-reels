name: Long site tour video

# 16:9 narrated tour of the site (3-8 min). Manual for now: upload=false builds the mp4 and keeps it as an artifact.
on:
  workflow_dispatch:
    inputs:
      lang:
        description: "Language (en or fa)"
        default: "en"
      script:
        description: "Script: tour-live or tour-long"
        default: "tour-live"
      upload:
        description: "Upload to YouTube (public)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tour:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install dependencies
        working-directory: instagram-bot
        run: npm install
      - name: Install Chromium + fonts + ffmpeg + espeak
        working-directory: instagram-bot
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-noto-core ffmpeg espeak-ng xvfb
          npx playwright install --with-deps chromium
      - name: Build the tour
        working-directory: instagram-bot
        env:
          TOUR_UPLOAD: ${{ inputs.upload }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY }}
        run: xvfb-run -a -s "-screen 0 1600x900x24" node scripts/${{ inputs.script }}.mjs ${{ inputs.lang }}
      - uses: actions/upload-artifact@v7
        with:
          name: tour-${{ inputs.lang }}
          path: |
            instagram-bot/out/tour*.mp4
            instagram-bot/out/shot_*.png
            instagram-bot/out/sheet.jpg
