name: TikTok — English

# Same teacher-whale reel as YouTube, posted to TikTok through the Zernio API (its approved TikTok app).
# Secret ZERNIO_API_KEY, variable ZERNIO_TIKTOK_ACCOUNT_ID. Scheduled runs follow TT_DRY_RUN (default true = generate only).

# T50-08 v6c 2026-11-12 (owner D195): NOW POSTS ONLY v6 (own drawings + option-B mascot); render + v6 shot-list gate BEFORE the post line
# (R65 video-style gate checks this). Old data/tour reel version kept as tiktok-en.yml.v5.disabled (plan B).

on:
  schedule:
    - cron: "30 21 * * *"   # v6c: 4:30 PM US Eastern (Shorts window, MAP/50 research log 2026-11-12)
    # DISABLED 2026-10-30 (T50-08): - cron: "15 19 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (generate only, do not publish)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: tiktok-bot-en
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: instagram-bot
        run: npm install

      - name: Install Chromium + system fonts + ffmpeg
        working-directory: instagram-bot
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-noto-core ffmpeg espeak-ng
          npx playwright install --with-deps chromium

      - name: Determine dry-run flag
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "dry_run=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=${{ vars.TT_DRY_RUN || 'true' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: v6 tests (bad shot list / non-pattern / missing mascot tags must FAIL)
        working-directory: instagram-bot
        run: node --test v2/test/*.test.mjs

      - name: Render today's v6 Short (owner D195 - every video on every platform = v6)
        working-directory: instagram-bot
        run: |
          T=$(node v2/v6-pick.mjs --slot=main | sed -n 's/^topic=//p'); node v2/v6-pick.mjs --slot=main | head -1
          node v2/v6-make.mjs --kind=short --topic=$T --out=out

      - name: v6 shot-list gate + standards gate (FAIL = not posted)
        working-directory: instagram-bot
        run: |
          for m in out/*.meta.json; do node v2/shotlist-gate.mjs $m; n=$(basename $m .meta.json); node v2/standards-check.mjs out $n; done

      - name: Post the v6 Short (TikTok via Zernio)
        working-directory: instagram-bot
        env:
          PLATFORM: tt
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ZERNIO_UPLOAD: "true"
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_TIKTOK_ACCOUNT_ID: ${{ vars.ZERNIO_TIKTOK_ACCOUNT_ID }}
        run: node scripts/run.mjs --lang=en --mode=v6 --meta=$(ls out/short-*.meta.json | head -1)

      - name: Upload generated video for review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tiktok-en-${{ github.run_id }}
          path: |
            instagram-bot/out/*.mp4
            instagram-bot/out/*.meta.json
            instagram-bot/out/*-strip.png
            instagram-bot/out/*-shotlist.md
            instagram-bot/out/*.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Save dedupe state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p instagram-bot/state/en-fb
          git add instagram-bot/state/en-fb
          git diff --cached --quiet || git commit -m "Facebook EN bot: update state [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push || true
