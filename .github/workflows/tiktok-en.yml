name: TikTok — English

# Same teacher-whale reel as YouTube, posted to TikTok through the Zernio API (its approved TikTok app).
# Secret ZERNIO_API_KEY, variable ZERNIO_TIKTOK_ACCOUNT_ID. Scheduled runs follow TT_DRY_RUN (default true = generate only).

on:
  schedule:
    - cron: "15 14 * * *"
    - cron: "15 19 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (generate only, do not publish)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: tiktok-bot-en
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: instagram-bot
        run: npm install

      - name: Install Chromium + system fonts + ffmpeg
        working-directory: instagram-bot
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-noto-core ffmpeg
          npx playwright install --with-deps chromium

      - name: Determine dry-run flag
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "dry_run=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=${{ vars.TT_DRY_RUN || 'true' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate and (maybe) publish reel
        working-directory: instagram-bot
        env:
          PLATFORM: tt
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ZERNIO_UPLOAD: "true"
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_TIKTOK_ACCOUNT_ID: ${{ vars.ZERNIO_TIKTOK_ACCOUNT_ID }}
        run: node scripts/run.mjs --lang=en --mode=${{ github.event.schedule == '15 19 * * *' && 'tour' || 'data' }}

      - name: Upload generated video for review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tiktok-en-${{ github.run_id }}
          path: instagram-bot/out/*.mp4
          if-no-files-found: ignore
          retention-days: 14

      - name: Save dedupe state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p instagram-bot/state/en-fb
          git add instagram-bot/state/en-fb
          git diff --cached --quiet || git commit -m "Facebook EN bot: update state [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push || true
